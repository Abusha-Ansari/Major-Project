<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-ray Pneumonia Detection</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #62708a;
      --line: #d9e0ea;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b42318;
      --ok: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }

    .dropzone {
      min-height: 430px;
      border: 2px dashed #aeb9c9;
      border-radius: 8px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fbfcfe;
      position: relative;
    }

    .dropzone.has-image {
      border-style: solid;
      background: #111827;
    }

    .dropzone img {
      width: 100%;
      height: 100%;
      max-height: 560px;
      object-fit: contain;
      display: none;
    }

    .dropzone.has-image img {
      display: block;
    }

    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .dropzone.has-image .placeholder {
      display: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    input[type="file"] {
      display: none;
    }

    button,
    .file-button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .file-button {
      background: #e7edf5;
      color: var(--ink);
    }

    button {
      background: var(--accent);
      color: white;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .result-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .prediction {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .prediction.normal {
      color: var(--ok);
    }

    .prediction.pneumonia {
      color: var(--danger);
    }

    .confidence {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .bar-row {
      margin: 14px 0;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    .bar {
      height: 12px;
      background: #e8edf4;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .error {
      color: var(--danger);
      font-weight: 700;
      margin-top: 16px;
      min-height: 20px;
    }

    @media (max-width: 820px) {
      header,
      main {
        display: block;
      }

      .status {
        margin-top: 12px;
        display: inline-block;
      }

      .panel + .panel {
        margin-top: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>X-ray Pneumonia Detection</h1>
      <div class="header-actions">
        <a href="/privacy">Privacy & Security</a>
        <a href="/admin">Admin Dashboard</a>
        <div class="status" id="status">Checking model...</div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="dropzone" id="dropzone">
          <img id="preview" alt="Selected X-ray preview">
          <div class="placeholder">
            <strong>Select an X-ray image</strong>
            <p>Upload a chest X-ray to test the trained federated model.</p>
          </div>
        </div>
        <div class="controls">
          <label class="file-button" for="imageInput">Choose Image</label>
          <input id="imageInput" type="file" accept="image/*">
          <button id="predictButton" disabled>Predict</button>
        </div>
        <div class="error" id="error"></div>
      </section>

      <aside class="panel">
        <h2 class="result-title">Result</h2>
        <p class="prediction" id="prediction">Waiting</p>
        <div class="confidence" id="confidence">No image submitted yet.</div>
        <div id="probabilities"></div>
      </aside>
    </main>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const predictButton = document.getElementById("predictButton");
    const preview = document.getElementById("preview");
    const dropzone = document.getElementById("dropzone");
    const prediction = document.getElementById("prediction");
    const confidence = document.getElementById("confidence");
    const probabilities = document.getElementById("probabilities");
    const error = document.getElementById("error");
    const status = document.getElementById("status");
    let selectedFile = null;

    async function loadHealth() {
      try {
        const response = await fetch("/health");
        const data = await response.json();
        status.textContent = data.model_loaded ? "Model ready" : "Model missing";
      } catch {
        status.textContent = "Server unavailable";
      }
    }

    imageInput.addEventListener("change", () => {
      selectedFile = imageInput.files[0] || null;
      error.textContent = "";
      predictButton.disabled = !selectedFile;
      if (!selectedFile) return;

      preview.src = URL.createObjectURL(selectedFile);
      dropzone.classList.add("has-image");
      prediction.textContent = "Ready";
      prediction.className = "prediction";
      confidence.textContent = "Click Predict to analyze this image.";
      probabilities.innerHTML = "";
    });

    predictButton.addEventListener("click", async () => {
      if (!selectedFile) return;

      predictButton.disabled = true;
      error.textContent = "";
      prediction.textContent = "Analyzing";
      prediction.className = "prediction";
      confidence.textContent = "Running model inference...";
      probabilities.innerHTML = "";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || "Prediction failed.");
        }

        const data = await response.json();
        const predicted = data.prediction;
        prediction.textContent = predicted;
        prediction.className = "prediction " + predicted.toLowerCase();
        confidence.textContent = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;

        probabilities.innerHTML = data.probabilities.map(item => `
          <div class="bar-row">
            <div class="bar-label">
              <span>${item.class_name}</span>
              <span>${(item.probability * 100).toFixed(2)}%</span>
            </div>
            <div class="bar"><span style="width: ${item.probability * 100}%"></span></div>
          </div>
        `).join("");
      } catch (err) {
        prediction.textContent = "Error";
        prediction.className = "prediction";
        confidence.textContent = "Could not complete prediction.";
        error.textContent = err.message;
      } finally {
        predictButton.disabled = !selectedFile;
      }
    });

    loadHealth();
  </script>
</body>
</html>
